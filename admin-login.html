<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>

        <h2>
            Student Complaint Management
        </h2>

        <div>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Student Login
            </a>

        </div>

    </nav>


    <div class="form-container">

        <h2>
            Admin Login
        </h2>


        <form id="adminLoginForm">

            <label>
                Admin Email
            </label>

            <input
                type="email"
                id="adminEmail"
                value="admin@gmail.com"
                readonly
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
                required
            >


            <button type="submit">
                Admin Login
            </button>

        </form>


        <p>
            Are you a student?
            <a href="login.html">
                Student Login
            </a>
        </p>

    </div>


    <script type="module" src="js/auth.js"></script>

</body>

</html>
